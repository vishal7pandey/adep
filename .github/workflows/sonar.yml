# SonarCloud analysis for a uv-based Python project (factory kit; create-mode: yours to edit).
# Safe by default: without the SONAR_TOKEN secret (fork PRs, Dependabot, a repo not set up yet) or
# while sonar-project.properties still has REPLACE_ME values, the guard step skips the scan with a
# notice and the job stays green. Setup steps: docs/sonarcloud.md in the factory repository.
# To make a failed quality gate fail this job, add `args: -Dsonar.qualitygate.wait=true` to the scan.
name: sonar

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: sonarcloud
    runs-on: ubuntu-latest
    # Fork PRs get no secrets: do not even start for them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check SonarCloud is set up
        id: guard
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          skip() {
            echo "::notice title=SonarCloud scan skipped::$1"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ -z "${SONAR_TOKEN:-}" ]; then
            skip "The SONAR_TOKEN secret is not available to this run (fork or Dependabot pull request, or not set up yet). Nothing was scanned."
          fi
          if [ ! -f sonar-project.properties ]; then
            skip "sonar-project.properties is missing. Nothing was scanned."
          fi
          if grep -Eq '^[[:space:]]*[^#[:space:]].*REPLACE_ME' sonar-project.properties; then
            skip "sonar-project.properties still has REPLACE_ME values: set the organization and project key in it. Nothing was scanned."
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      # The install and test steps below mirror the `backend` job in ci.yml (ADE-55): same Python (3.11),
      # same dependencies, same marker filter and deselects, so Sonar sees the same tests and coverage as CI.
      # Keep the --deselect list in step with ci.yml (ADE-23, ADE-24); remove a line there and here together.
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.guard.outputs.enabled == 'true'
      - name: Set up Python
        if: steps.guard.outputs.enabled == 'true'
        run: uv python install 3.11
      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: uv sync --all-extras
      - name: Tests with coverage (same as ci.yml, plus the XML report for Sonar)
        if: steps.guard.outputs.enabled == 'true'
        run: >
          uv run pytest src/tests/ -v --tb=short -m "not integration"
          --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=100
          --deselect src/tests/test_e2e.py::TestE2EInvoiceMocked::test_invoice_e2e_mocked
          --deselect src/tests/test_e2e.py::TestE2ESeedAndRun::test_seeded_definitions_exist
          --deselect src/tests/test_e2e.py::TestE2ESeedAndRun::test_invoice_run_produces_result
          --deselect src/tests/test_e2e.py::TestE2ESeedAndRun::test_utility_bill_run_mocked
          --deselect src/tests/test_e2e.py::TestE2ESeedAndRun::test_medical_claim_run_mocked
          --deselect src/tests/test_e2e.py::TestE2ESeedAndRun::test_boq_run_mocked
          --deselect src/tests/test_e2e.py::TestE2EResultSerialization::test_result_has_required_keys
          --deselect src/tests/test_stabilization.py::TestMaxCyclesOverride::test_override_used_in_recursion_limit
          --deselect src/tests/test_agent_control.py::TestCompactEndpoint::test_compact_run_not_in_executor_returns_false
      - name: SonarCloud scan
        if: steps.guard.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
