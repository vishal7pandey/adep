# ADEP CI Pipeline [BLK-063]
# Runs backend tests (and, once clean, lint and type checks) on every PR and push to master

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      # TEMPORARILY DISABLED (ADE-1): ruff reports 1043 errors on master, tracked in ADE-20.
      # Re-enable `uv run ruff check src/` when ADE-20 is done.
      # - name: Lint (ruff)
      #   run: uv run ruff check src/

      # TEMPORARILY DISABLED (ADE-1): mypy reports 183 errors on master, tracked in ADE-21.
      # Re-enable `uv run mypy src/ --ignore-missing-imports` when ADE-21 is done.
      # - name: Type check (mypy)
      #   run: uv run mypy src/ --ignore-missing-imports

      # One run does both the tests and the 80% coverage gate (they used to be two full runs).
      # The --deselect lines are tests that fail on a clean checkout today (confirmed on GitHub's Linux runner); each has a ticket.
      # Remove a line when its ticket is fixed.
      #   ADE-23: e2e/stabilization tests that need LLM credentials or a real PDF, stale count
      #   ADE-24: compact endpoint test depends on leftover local state
      - name: Tests (pytest) with coverage gate
        run: >
          uv run pytest src/tests/ -v --tb=short
          --cov=src --cov-report=term-missing --cov-fail-under=80
          --deselect src/tests/test_e2e.py::TestE2EInvoiceMocked::test_invoice_e2e_mocked
          --deselect src/tests/test_e2e.py::TestE2ESeedAndRun::test_seeded_definitions_exist
          --deselect src/tests/test_e2e.py::TestE2ESeedAndRun::test_invoice_run_produces_result
          --deselect src/tests/test_e2e.py::TestE2ESeedAndRun::test_utility_bill_run_mocked
          --deselect src/tests/test_e2e.py::TestE2ESeedAndRun::test_medical_claim_run_mocked
          --deselect src/tests/test_e2e.py::TestE2ESeedAndRun::test_boq_run_mocked
          --deselect src/tests/test_e2e.py::TestE2EResultSerialization::test_result_has_required_keys
          --deselect src/tests/test_stabilization.py::TestMaxCyclesOverride::test_override_used_in_recursion_limit
          --deselect src/tests/test_agent_control.py::TestCompactEndpoint::test_compact_run_not_in_executor_returns_false

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # TEMPORARILY DISABLED (ADE-1): eslint reports 22 errors on master, tracked in ADE-28.
      # Re-enable `pnpm run lint` when ADE-28 is done.
      # - name: Lint (eslint)
      #   working-directory: frontend
      #   run: pnpm run lint

      - name: Tests (vitest)
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm run build

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Path filter (docker files)
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'frontend/Dockerfile'
              - '.dockerignore'
              - 'frontend/.dockerignore'
              - '.github/workflows/ci.yml'
      # TEMPORARILY DISABLED (ADE-1): the backend Dockerfile copies a requirements.txt that does
      # not exist, tracked in ADE-27. Re-enable both steps when ADE-27 is done.
      # - name: Docker build (backend)
      #   if: steps.filter.outputs.docker == 'true'
      #   run: docker build -f Dockerfile -t adep-backend:ci .
      # - name: Docker compose build
      #   if: steps.filter.outputs.docker == 'true'
      #   run: docker compose build
