# ADEP CI Pipeline [BLK-063]
# Runs backend lint, tests, type checks on every PR and push to main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check src/

      - name: Type check (mypy)
        run: uv run mypy src/ --ignore-missing-imports

      - name: Tests (pytest)
        run: uv run pytest src/tests/ -v --tb=short

      - name: Test coverage
        run: uv run pytest src/tests/ --cov=src --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        working-directory: frontend
        run: pnpm run lint

      - name: Tests (vitest)
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm run build

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Path filter (docker files)
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'frontend/Dockerfile'
              - '.dockerignore'
              - 'frontend/.dockerignore'
              - '.github/workflows/ci.yml'
      - name: Docker build (backend)
        if: steps.filter.outputs.docker == 'true'
        run: docker build -f Dockerfile -t adep-backend:ci .
      - name: Docker compose build
        if: steps.filter.outputs.docker == 'true'
        run: docker compose build
